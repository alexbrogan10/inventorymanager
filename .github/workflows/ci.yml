name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Milestone 17 added Redis-backed dashboard caching, and with it
      # tests (test_dashboard.py's TestCaching, plus the conftest.py
      # redis_client fixture's flushdb() calls) that need a real Redis to
      # connect to - without this service they fail with ConnectionError.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@localhost:5432/inventory
      # A separate database from DATABASE_URL - see docs/ARCHITECTURE.md's
      # testing strategy. Created by the "Create test database" step below.
      TEST_DATABASE_URL: postgresql+psycopg://inventory:inventory@localhost:5432/inventory_test
      REDIS_URL: redis://localhost:6379/0
      # A separate logical DB from REDIS_URL, matching TEST_DATABASE_URL's
      # isolation from DATABASE_URL above.
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy app tests

      - name: Create test database
        run: |
          python -c "
          import psycopg
          conn = psycopg.connect('postgresql://inventory:inventory@localhost:5432/inventory', autocommit=True)
          conn.execute('CREATE DATABASE inventory_test')
          "

      - name: Run migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Gated on the quick lint/type/test jobs so a broken PR fails in ~1
    # minute instead of waiting on a multi-stage image build - the build
    # check only runs once the code it's packaging is already known-good.
    needs: [backend, frontend]

    strategy:
      matrix:
        include:
          - service: backend
            target: runtime
          - service: frontend
            target: prod

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Milestone 17's Dockerfiles were only ever validated with
      # `docker compose config` (no Docker daemon in the dev sandbox they
      # were written in) - this is the first place they're actually built.
      - name: Build ${{ matrix.service }} image (${{ matrix.target }} stage)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          target: ${{ matrix.target }}
          push: false
          tags: inventorymanager-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
