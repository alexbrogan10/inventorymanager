# Production nginx config for the `prod` build stage in Dockerfile.
#
# The browser only ever talks to this one origin: API calls (`/api/`) and
# uploaded product images (`/static/`) are reverse-proxied to the backend
# service rather than requiring a second public origin, matching
# docs/ARCHITECTURE.md's "one auditable entry point" principle - it also
# means CORS is a non-issue in production (same-origin), unlike local dev
# where the Vite dev server and FastAPI run on different ports.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 'unsafe-inline' on style-src is required by MUI/Emotion, which inject
    # <style> tags at runtime rather than shipping static stylesheets - the
    # app itself loads no third-party scripts/styles/fonts, so every other
    # directive is locked to 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Vite content-hashes build output filenames, so these can be cached
    # forever - a new deploy ships new filenames, never a stale one under an
    # old name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated - it's what references the
    # current deploy's hashed asset filenames, so caching it would pin
    # clients to a stale build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: any other path is a client-side route, not a real file.
    location / {
        try_files $uri /index.html;
    }
}
