# Production-shaped topology. Differs from docker-compose.yml in every way
# that matters for a real deployment:
#   - hardened images (multi-stage backend, non-root nginx frontend), no
#     --reload, no bind-mounted source
#   - db/redis are internal-only (no published ports) - the frontend is the
#     only public entry point, reverse-proxying /api and /static to the
#     backend (see frontend/nginx.conf), so the browser never talks to
#     Postgres, Redis, or the backend directly
#   - secrets come from a root `.env` file (see .env.example), never
#     hardcoded here - `:?` on a variable means compose refuses to start
#     without it explicitly set
#   - `restart: unless-stopped` on every service, since nothing here is
#     expected to exit on its own
#
# Usage:
#   cp .env.example .env   # fill in real secrets
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # A pure cache: no persistence needed (losing it on restart just means
    # the next dashboard request recomputes instead of hitting a warm
    # cache), and maxmemory + an eviction policy bounds memory instead of
    # ever risking an OOM kill.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventory}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set - generate with `openssl rand -hex 32`}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ENVIRONMENT: production
      DEBUG: "false"
      # Left empty by default: the frontend reaches the backend through
      # nginx's same-origin proxy, so no cross-origin caller needs allowing
      # unless the API is also meant to be called directly from elsewhere.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - backend_uploads:/app/uploads
      - backend_ml_artifacts:/app/ml_artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
  backend_ml_artifacts:
