# Local development stack. Runs the backend with --reload and the frontend
# against the Vite dev server, both bind-mounted for hot reload - this is not
# the production topology (that lands in Milestone 17 with the `prod` frontend
# target and a hardened backend image).
#
# Usage:
#   cp ../backend/.env.example ../backend/.env
#   cp ../frontend/.env.example ../frontend/.env
#   docker compose -f docker-compose.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../backend/.env
    environment:
      # Overrides the .env value: inside the compose network the database is
      # reachable at the `db` service name, not `localhost`.
      DATABASE_URL: postgresql+psycopg://inventory:inventory@db:5432/inventory
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ../frontend/.env
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
